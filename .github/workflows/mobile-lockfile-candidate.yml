# 임시 lockfile 후보 생성. #467의 공식 registry 원문만 사용하며 운영 비밀과 write 권한은 없습니다.
# 검증 및 lockfile 반영 후 이 워크플로는 삭제합니다.
name: Expo SDK 잠금 파일 후보 검증

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/mobile-lockfile-candidate.yml'

permissions:
  contents: read

jobs:
  lock-candidate:
    if: github.event.pull_request.number == 467
    name: 공식 npm registry lockfile 후보
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-sdk-lock-committed-before-467
          path: apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: 공식 npm registry에서 scripts 없이 package-lock 재생성
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_ignore_scripts: 'true'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: 루트 버전·공식 registry·무결성 필수 확인
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const p = JSON.parse(readFileSync('package.json','utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json','utf8'));
          for (const name of ['expo','react','react-dom','react-native-safe-area-context']) {
            assert.equal(lock.packages[''].dependencies[name], p.dependencies[name], name);
            const installed = lock.packages['node_modules/'+name];
            assert.equal(installed.version, p.dependencies[name], name);
            assert.match(installed.resolved, /^https:\/\/registry\.npmjs\.org\//);
            assert.match(installed.integrity, /^sha512-[A-Za-z0-9+/=]+$/);
          }
          for (const [path, entry] of Object.entries(lock.packages)) {
            if (!path || entry.link || !entry.resolved) continue;
            assert.ok(entry.resolved.startsWith('https://registry.npmjs.org/'), path);
          }
          console.log('EXPO_LOCK_CANDIDATE_REGISTRY_AND_INTEGRITY_VALID');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-sdk-lock-candidate-467
          path: apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: 최신 npm 감사 스냅샷을 허용 필드로만 추출
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { dependencySnapshot } from '../../scripts/_lib/dependency-policy.mjs';
          const run = spawnSync('npm', ['audit','--json','--package-lock-only','--ignore-scripts','--registry=https://registry.npmjs.org','--fetch-retries=0','--fetch-timeout=30000'], {encoding:'utf8',maxBuffer:16*1024*1024,timeout:60000,stdio:['ignore','pipe','pipe']});
          if (run.error || ![0,1].includes(run.status)) throw new Error('MOBILE_AUDIT_FAILED');
          let report; try { report=JSON.parse(run.stdout); } catch { throw new Error('MOBILE_AUDIT_FAILED'); }
          if (report.error) throw new Error('MOBILE_AUDIT_FAILED');
          const snapshot=dependencySnapshot(report,JSON.parse(readFileSync('package-lock.json','utf8')));
          writeFileSync('mobile-audit-snapshot-467.json',JSON.stringify(snapshot,null,2)+'\n');
          console.log('MOBILE_AUDIT_SNAPSHOT_PACKAGES='+snapshot.length);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-sdk-audit-snapshot-467
          path: apps/mobile/mobile-audit-snapshot-467.json
          if-no-files-found: error
          retention-days: 1
